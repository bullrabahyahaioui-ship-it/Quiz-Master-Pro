name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Expo CLI
        run: npm install -g @expo/cli
      - name: Prebuild
        run: cd artifacts/mobile && npx expo prebuild --platform android
      - name: Build APK
        run: cd artifacts/mobile/android && ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizMaster-APK
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
