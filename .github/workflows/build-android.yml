name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install pnpm
        run: npm install -g pnpm
      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install mobile dependencies
        run: cd artifacts/mobile && pnpm install --no-frozen-lockfile
      - name: Install Expo CLI
        run: npm install -g @expo/cli
      - name: Prebuild
        run: cd artifacts/mobile && npx expo prebuild --platform android --no-install
      - name: Generate Keystore
        run: keytool -genkeypair -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android -dname "CN=QuizMaster, OU=App, O=Quiz, L=Cty, ST=ST, C=US"
      - name: Build Release APK
        run: cd artifacts/mobile/android && ./gradlew assembleRelease -Pandroid.injected.signing.store.file=../../../release.keystore -Pandroid.injected.signing.store.password=android -Pandroid.injected.signing.key.alias=release -Pandroid.injected.signing.key.password=android
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuizMaster-Release-APK
          path: artifacts/mobile/android/app/build/outputs/apk/release/app-release.apk
